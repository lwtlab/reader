name: Desktop storage contracts
run-name: Desktop storage contracts

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full 40-character commit SHA in the private source repository
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-storage:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'A full commit SHA is required.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Checkout private source read-only
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: source/apps/reader/package.json
      - name: Install private application dependencies
        env:
          READER_INSTALL_NETWORK: direct
        run: node ci/private-step.mjs dependencies source/apps/reader bash --noprofile --norc scripts/install.sh --frozen-lockfile
      - name: Check native ESM import
        run: >-
          node ci/private-step.mjs native-import source/apps/reader node --input-type=module
          -e "await import('./scripts/desktop-storage-probe.mjs'); console.log('PASS native ESM storage probe import')"
      - name: Run storage contracts
        run: >-
          node ci/private-step.mjs storage-contracts source/apps/reader pnpm exec vitest run --maxWorkers=1 --reporter=json
          scripts/desktop-storage-probe.test.ts lib/articles/part-store-durable.test.ts
      - name: Encrypt private logs
        if: always()
        run: node ci/seal-log.mjs
      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-windows-storage-encrypted-log
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reader-private-build.log.enc.json
