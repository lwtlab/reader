name: Actual desktop auto-update acceptance
run-name: Actual desktop ${{ inputs.target }} auto-update acceptance
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full private QA runner SHA, pinned separately from both application versions
        required: true
        type: string
      target:
        description: Approved authenticated upgrade pair
        required: true
        default: all
        type: choice
        options: [all, darwin-arm64, darwin-x64, win32-x64, linux-x64]
permissions:
  contents: read
  actions: read
jobs:
  targets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - id: select
        env:
          AUTO_UPDATE_SELECT: 'true'
          UPDATE_TARGET: ${{ inputs.target }}
          QA_SOURCE_REF: ${{ inputs.source_ref }}
        run: node ci/verify-auto-update-baseline.mjs
  acceptance:
    if: github.ref == 'refs/heads/main'
    needs: targets
    name: actual-update-${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Test authenticated upgrade provenance
        run: node --test ci/verify-auto-update-baseline.test.mjs ci/verify-update-candidate.test.mjs
      - name: Verify both approved authenticated candidate producers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATE_TARGET: ${{ matrix.id }}
          QA_SOURCE_REF: ${{ inputs.source_ref }}
        run: node ci/verify-auto-update-baseline.mjs
      - name: Download immutable enabled baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.from.run_id }}
          artifact-ids: ${{ matrix.from.artifact_id }}
          merge-multiple: true
          path: from-candidate
      - name: Download immutable higher test version
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.to.run_id }}
          artifact-ids: ${{ matrix.to.artifact_id }}
          merge-multiple: true
          path: to-candidate
      - name: Checkout immutable QA runner read-only
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: source/apps/reader/package.json
      - name: Install native Linux runtime and window automation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libfuse2 xvfb xauth openbox x11-utils iproute2 xdotool wmctrl
      - name: Install QA dependencies without signing credentials
        timeout-minutes: 10
        env:
          READER_INSTALL_NETWORK: direct
        run: node ci/private-step.mjs dependencies source/apps/reader bash --noprofile --norc scripts/install.sh --frozen-lockfile
      - uses: ./.github/actions/privacy-tools
      - name: Prepare owned receipt directory
        run: mkdir -p acceptance
      - name: Execute actual macOS signed Squirrel upgrade and retained-data checks
        if: runner.os == 'macOS'
        timeout-minutes: 25
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs actual-auto-update source/apps/reader node scripts/smoke-desktop-auto-update.mjs
          "${{ github.workspace }}/from-candidate" "${{ github.workspace }}/to-candidate"
          "${{ github.workspace }}/acceptance/desktop-auto-update-acceptance.json"
      - name: Execute actual Windows authenticated NSIS upgrade and retained-data checks
        if: runner.os == 'Windows'
        timeout-minutes: 25
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs actual-auto-update source/apps/reader node scripts/smoke-desktop-actual-update.mjs
          "${{ github.workspace }}/from-candidate" "${{ github.workspace }}/to-candidate"
          "${{ github.workspace }}/acceptance/desktop-auto-update-acceptance.json"
      - name: Execute actual Linux authenticated AppImage upgrade and retained-data checks
        if: runner.os == 'Linux'
        timeout-minutes: 25
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: >-
          node ci/private-step.mjs actual-auto-update source/apps/reader bash ../../../ci/run-xvfb.sh
          node scripts/smoke-desktop-actual-update.mjs
          "${{ github.workspace }}/from-candidate" "${{ github.workspace }}/to-candidate"
          "${{ github.workspace }}/acceptance/desktop-auto-update-acceptance.json"
      - name: Audit exact actual-upgrade receipt before upload
        run: node ci/private-step.mjs privacy source node ../ci/privacy-candidates.mjs ../acceptance
      - name: Upload qualified actual-upgrade receipt only
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.id }}-actual-auto-update-acceptance
          retention-days: 7
          if-no-files-found: error
          path: acceptance/desktop-auto-update-acceptance.json
      - name: Encrypt private upgrade diagnostics
        if: always()
        run: node ci/seal-log.mjs
      - name: Upload encrypted upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.id }}-actual-auto-update-encrypted-log
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reader-private-build.log.enc.json
