name: Verified candidate portable checks
run-name: Portable runtime ${{ inputs.target }}
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full private commit SHA containing the QA scripts (candidate source stays pinned in ci/portable-baselines.json)
        required: true
        type: string
      target:
        description: Portable runtime target
        required: true
        default: all
        type: choice
        options: [all, win32-x64, linux-x64]
permissions:
  contents: read
  actions: read
jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          QA_SOURCE_REF: ${{ inputs.source_ref }}
          PORTABLE_TARGET: ${{ inputs.target }}
        run: node ci/select-portable-targets.mjs
  runtime:
    needs: targets
    name: portable-${{ matrix.id }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate approved candidate provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PORTABLE_TARGET: ${{ matrix.id }}
        run: |
          node --test ci/verify-portable-baseline.test.mjs ci/log-crypto.test.mjs ci/private-step.test.mjs ci/run-xvfb.test.mjs
          node ci/verify-portable-baseline.mjs
      - name: Download the approved immutable artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.run_id }}
          artifact-ids: ${{ matrix.artifact_id }}
          merge-multiple: true
          path: candidate
      - name: Checkout QA source read-only
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: source/apps/reader/package.json
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libfuse2 xvfb xauth openbox x11-utils
      - name: Install QA dependencies
        timeout-minutes: 10
        env:
          READER_INSTALL_NETWORK: direct
        run: node ci/private-step.mjs dependencies source/apps/reader bash --noprofile --norc scripts/install.sh --frozen-lockfile
      - name: Test QA artifact and host guards
        run: node ci/private-step.mjs portable-contracts source/apps/reader node --test scripts/desktop-installer-target.test.mjs

      - name: Validate Windows single-file runtime
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs portable source/apps/reader node scripts/smoke-desktop-portable.mjs ../../../candidate
      - name: Validate Linux single-file runtime
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs portable source/apps/reader bash ../../../ci/run-xvfb.sh bash ../../../ci/linux-display-context.sh node scripts/smoke-desktop-portable.mjs ../../../candidate
      - name: Encrypt private QA logs
        if: always()
        run: node ci/seal-log.mjs
      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.id }}-encrypted-log
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reader-private-build.log.enc.json
