      DESKTOP_REUSE_NATIVE: 'false'
      DESKTOP_REUSE_RUNTIME: 'false'
      DESKTOP_WINDOWS_SIGNAL: 'false'
      PR_NUMBER: ${{ needs.resolve-example.outputs.pr }}
      SOURCE_REF: ${{ needs.resolve-example.outputs.tested }}
      APP_REF: ${{ needs.resolve-example.outputs.tested }}
      CORE_REF: ${{ needs.resolve-example.outputs.tested }}
