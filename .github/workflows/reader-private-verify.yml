        run: node hear-ci/ci/private-step.mjs link app node scripts/link-core.mjs
      - name: Install frozen application dependencies
        run: node hear-ci/ci/private-step.mjs install app pnpm install --frozen-lockfile
      - id: desktop_checks
        name: Execute all seven shared native and scripted GUI tasks
        run: |
          node hear-ci/ci/desktop-catalog.mjs --verify-input
