            echo 'LWT_PUBLIC_KEY'
          } >> "$GITHUB_ENV"
      - name: Validate explicit desktop scope and encryption
        run: node hear-ci/ci/desktop-catalog.mjs --start
      - uses: actions/checkout@v4
