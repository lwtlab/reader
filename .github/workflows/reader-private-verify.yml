  aggregate-example:
    needs: [resolve-example, example-plan, example-full, example-cpu, example-hear]
    if: always() && needs.resolve-example.result == 'success'
    name: Require source-bound complete real change coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHANGE_EXAMPLE: ${{ inputs.example }}
      VERIFICATION_BINDING: ${{ needs.resolve-example.outputs.binding }}
      CHANGE_OUTCOMES: '{"plan":"${{ needs.example-plan.result }}","full":"${{ needs.example-full.result }}","cpu":"${{ needs.example-cpu.result }}","hear":"${{ needs.example-hear.result }}"}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: actions/download-artifact@v4
        with:
          name: reader-change-plan-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: change-inputs/plan
      - uses: actions/download-artifact@v4
        with:
          name: reader-change-full-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: change-inputs/full
      - uses: actions/download-artifact@v4
        with:
          name: reader-change-cpu-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: change-inputs/cpu
      - uses: actions/download-artifact@v4
        with:
          name: reader-change-hear-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: change-inputs/hear
      - name: Join only this source, workflow, run and attempt
        if: always()
        run: node ci/change-examples.mjs aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-change-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: change-result/qualification.json
          retention-days: 7
          if-no-files-found: error

  resolve-selected:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'selected-source'
    name: Resolve reviewed selected source execution
    runs-on: ubuntu-24.04
    environment: reader-verification
    timeout-minutes: 10
    outputs:
      binding: ${{ steps.resolve.outputs.binding }}
      tested: ${{ steps.resolve.outputs.tested }}
      head: ${{ steps.resolve.outputs.head }}
      base: ${{ steps.resolve.outputs.base }}
      pr: ${{ steps.resolve.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - id: resolve
        name: Validate pinned example, trusted nested PR and actual merge parents
        env:
          GH_TOKEN: ${{ secrets.READER_VERIFICATION_TOKEN }}
          SELECTION_PROBE: ${{ inputs.selection_probe }}
          SELECTION_CASE: ${{ inputs.example }}
          WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node ci/selected-source.mjs resolve

  selected-plan:
    if: inputs.scope == 'selected-source'
    needs: resolve-selected
    name: Selected source plan and controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SELECTION_PROBE: ${{ inputs.selection_probe }}
      SELECTION_CASE: ${{ inputs.example }}
      VERIFICATION_BINDING: ${{ needs.resolve-selected.outputs.binding }}
    outputs:
      reader_profile: ${{ steps.collect.outputs.reader_profile }}
      hear_required: ${{ steps.collect.outputs.hear_required }}
      core_required: ${{ steps.collect.outputs.core_required }}
      plan_sha: ${{ steps.collect.outputs.plan_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Read exact tested private source
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ needs.resolve-selected.outputs.tested }}
          path: source
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          submodules: false
      - name: Validate independently pinned selected implementation
        run: node ci/selected-source.mjs identity
      - id: controls
        name: Qualify actual planner, CLI, executors and failure propagation
        run: node ci/private-step.mjs selected-controls source node --test scripts/verification-catalog.test.mjs scripts/verification-execution.test.mjs
      - id: plan
        name: Compute source-bound selected plan with no task success claims
        run: node ci/private-step.mjs selected-plan source node scripts/verify-selected.mjs plan
      - id: collect
        name: Validate bounded selected plan and encrypt original bytes
        if: always()
        env:
          SELECTION_CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          SELECTION_PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: node ci/selected-source.mjs plan-collect
      - name: Encrypt private control output
        if: always()
        run: node ci/selected-source.mjs seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-selected-plan-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: selected-output/plan.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-selected-plan-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: selected-output/*.enc.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Require the independently validated plan
        if: always()
        run: node ci/selected-source.mjs plan-require

  selected-reader:
    if: inputs.scope == 'selected-source' && (!inputs.selection_probe || needs.selected-plan.outputs.reader_profile == 'quick')
    needs: [resolve-selected, selected-plan]
    name: Selected Reader source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SELECTION_PROBE: ${{ inputs.selection_probe }}
      SELECTION_CASE: ${{ inputs.example }}
      VERIFICATION_BINDING: ${{ needs.resolve-selected.outputs.binding }}
    steps:
      - name: Mark runner preparation start
        run: echo "READER_PREPARATION_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: site/package.json
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - name: Prepare public system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg build-essential pkg-config libssl-dev
          docker --host unix:///var/run/docker.sock pull postgres:17.7-bookworm
      - name: Read exact private source without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ needs.resolve-selected.outputs.tested }}
          path: source
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          submodules: false
      - name: Verify selected implementation and immutable merge identity
        run: node ci/selected-source.mjs identity
      - name: Compute the same canonical selected plan in this checkout
        run: node ci/private-step.mjs selected-plan source node scripts/verify-selected.mjs plan
      - uses: actions/download-artifact@v4
        with:
          name: reader-selected-plan-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: selected-inputs/plan
      - name: Initialize fixed public submodules
        run: >-
          node ci/private-step.mjs submodules source git
          -c submodule.aspeak.url=https://github.com/XUJiahua/aspeak.git
          -c submodule.srtparse.url=https://github.com/XUJiahua/srtparse.git
          submodule update --init -- aspeak srtparse
      - name: Verify public registry download policy
        run: node ci/reader-download-cache.mjs
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/reader-mobile-public-cache/_cacache
          key: reader-mobile-public-${{ runner.os }}-${{ runner.arch }}-node24.22.0-${{ hashFiles('source/apps/reader-mobile/package-lock.json') }}
      - name: Install frozen private dependencies and managed hooks
        env:
          READER_INSTALL_NETWORK: direct
        run: |
          node ci/private-step.mjs hooks source bash scripts/install-git-hooks.sh
          node ci/private-step.mjs dependencies source bash apps/reader/scripts/install.sh --frozen-lockfile
      - name: Install frozen Mobile registry dependencies
        env:
          npm_config_cache: ${{ runner.temp }}/reader-mobile-public-cache
        run: node ci/private-step.mjs mobile-dependencies source npm --prefix apps/reader-mobile ci --include=dev --legacy-peer-deps
      - name: Install quick preflight Chromium and Chrome
        if: needs.selected-plan.outputs.reader_profile == 'quick'
        run: node ci/private-step.mjs browsers source pnpm --dir apps/reader exec playwright install --with-deps chromium chrome
      - name: Install browser runtimes
        if: needs.selected-plan.outputs.reader_profile == 'full'
        run: node ci/private-step.mjs browsers source pnpm --dir apps/reader exec playwright install --with-deps chromium firefox webkit chrome
      - id: reader
        name: Execute exactly the selected Reader profile
        env:
          READER_SELECTED_PROFILE: ${{ needs.selected-plan.outputs.reader_profile }}
        run: |
          case "$READER_SELECTED_PROFILE" in full|quick) ;; *) exit 1 ;; esac
          if [ "$READER_SELECTED_PROFILE" = full ]; then phase=full-verification; else phase=selected-reader-quick; fi
          node ci/private-step.mjs "$phase" source node scripts/verify.mjs --profile "$READER_SELECTED_PROFILE"
      - name: Produce legacy full33 receipt only for the full profile
        if: always() && needs.selected-plan.outputs.reader_profile == 'full'
        env:
          VERIFICATION_OUTCOME: ${{ steps.reader.outcome }}
        run: node ci/reader-verification-run.mjs receipt
      - name: Collect source-bound Reader execution and raw summary
        if: always()
        env:
          SELECTED_READER_OUTCOME: ${{ steps.reader.outcome }}
        run: node ci/selected-source.mjs reader-collect
      - name: Encrypt selected plan, summary and private output
        if: always()
        run: node ci/selected-source.mjs seal
      - name: Encrypt complete synthetic diagnostics
        if: always()
        run: node ci/reader-verification-run.mjs seal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-selected-reader-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            selected-output/selection.json
            selected-output/verification.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-selected-reader-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            selected-output/*.enc.json
            verification-output/diagnostics.enc.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-selected-reader-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-output/progress.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Require actual selected Reader execution
        if: always()
        run: node ci/selected-source.mjs reader-require

