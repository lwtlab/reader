      - name: Read independently pinned public Hear adapter
        uses: actions/checkout@v4
        with:
          repository: lwtlab/hear
          ref: 3cf181b04a953e647ae28e54d0e5d5279f2f250a
          path: hear-ci
          persist-credentials: false
      - name: Load the existing public diagnostic encryption key
        run: |
          {
