        run: node hear-ci/ci/private-step.mjs prepare core bash scripts/hear.sh init
      - name: Link source core
        run: node hear-ci/ci/private-step.mjs link app node scripts/link-core.mjs
      - name: Install frozen application dependencies
        run: node hear-ci/ci/private-step.mjs install app pnpm install --frozen-lockfile
      - id: desktop_checks
        name: Execute all seven shared native and scripted GUI tasks
        run: |
          node hear-ci/ci/desktop-catalog.mjs --verify-input
          node hear-ci/ci/private-step.mjs desktop-catalog core bash scripts/hear.sh desktop-check
      - id: result
        name: Independently collect source-bound desktop result
        if: always()
        env:
          DESKTOP_EXECUTION_OUTCOME: ${{ steps.desktop_checks.outcome }}
        run: node hear-ci/ci/desktop-catalog.mjs --collect
      - uses: actions/upload-artifact@v4
        if: always() && steps.result.outcome == 'success'
        with:
          name: reader-selected-hear-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: desktop-catalog-receipt/verification.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-selected-hear-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/desktop-*.enc.json
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-selected-hear-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: desktop-catalog-progress/progress.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Require fresh native and scripted GUI success
        if: always()
        env:
          DESKTOP_EXECUTION_OUTCOME: ${{ steps.desktop_checks.outcome }}
        run: node hear-ci/ci/desktop-catalog.mjs --require-pass


  aggregate-selected:
    needs: [resolve-selected, selected-plan, selected-reader, selected-cpu, selected-hear]
    if: always() && needs.resolve-selected.result == 'success'
    name: Require selected source coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SELECTION_CASE: ${{ inputs.example }}
      SELECTION_PROBE: ${{ inputs.selection_probe }}
      VERIFICATION_BINDING: ${{ needs.resolve-selected.outputs.binding }}
      SELECTION_OUTCOMES: '{"plan":"${{ needs.selected-plan.result }}","reader":"${{ needs.selected-reader.result }}","cpu":"${{ needs.selected-cpu.result }}","hear":"${{ needs.selected-hear.result }}"}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: actions/download-artifact@v4
        with:
          name: reader-selected-plan-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: selected-inputs/plan
      - uses: actions/download-artifact@v4
        if: '!inputs.selection_probe'
        with:
          name: reader-selected-reader-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: selected-inputs/reader
      - uses: actions/download-artifact@v4
        with:
          name: reader-selected-cpu-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: selected-inputs/cpu
      - uses: actions/download-artifact@v4
        if: needs.selected-plan.outputs.hear_required == 'true'
        with:
          name: reader-selected-hear-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: selected-inputs/hear
      - name: Require complete actual selected coverage
        if: always() && !inputs.selection_probe
        run: node ci/selected-source.mjs aggregate
      - name: Record focused diagnostic without a gate receipt
        if: always() && inputs.selection_probe
        run: node ci/selected-source.mjs probe
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.selection_probe
        with:
          name: reader-selected-qualification-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: selected-output/qualification.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && inputs.selection_probe
        with:
          name: reader-selected-component-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: selected-output/probe.json
          if-no-files-found: error
          retention-days: 7

  report-selected:
    needs: [resolve-selected, aggregate-selected]
    if: always() && needs.resolve-selected.result == 'success' && !inputs.selection_probe
    name: Independently report selected source result
    runs-on: ubuntu-24.04
    environment: reader-verification
    timeout-minutes: 10
    env:
      SELECTION_CASE: ${{ inputs.example }}
      SELECTION_PROBE: ${{ inputs.selection_probe }}
      VERIFICATION_BINDING: ${{ needs.resolve-selected.outputs.binding }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Revalidate actual run, artifacts, complete coverage and live private refs
        env:
          GH_TOKEN: ${{ secrets.READER_VERIFICATION_TOKEN }}
        run: node ci/selected-source.mjs report
