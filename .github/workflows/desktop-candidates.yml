name: Desktop candidate packages
run-name: Desktop ${{ inputs.target || 'all' }} candidates

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full 40-character commit SHA in the private source repository
        required: true
        type: string

      target:
        description: Native build target
        required: true
        default: all
        type: choice
        options:
          - all
          - darwin-arm64
          - darwin-x64
          - win32-x64
          - linux-x64

      internal:
        description: Build internal bundled-speech candidates without releases
        type: boolean
        default: false

      acceptance_json:
        description: Internal upgrade inputs — baselineVersion or historical baselineRun, candidateRun, toolingSha
        type: string
        default: ''

      baseline_only:
        description: Rebuild fixed historical core source solely as upgrade baseline
        type: boolean
        default: false

      verify_upgrade:
        description: Require upgrade from the approved previous candidate (disable only when rebuilding a baseline; no upgrade acceptance)
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: node ci/select-targets.mjs
  build:
    if: ${{ !inputs.internal && inputs.acceptance_json == '' && !inputs.baseline_only }}
    needs: targets
    name: ${{ matrix.id }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate immutable source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'A full commit SHA is required.'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0

      - name: Test public CI infrastructure
        run: node --test ci/log-crypto.test.mjs ci/private-step.test.mjs ci/verify-portable-baseline.test.mjs ci/run-xvfb.test.mjs ci/audit-package.test.mjs

      - name: Verify approved upgrade baseline
        if: inputs.verify_upgrade
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ matrix.id }}
        run: node ci/verify-upgrade-baseline.mjs

      - name: Download immutable previous candidate
        if: inputs.verify_upgrade
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.baseline_run_id }}
          artifact-ids: ${{ matrix.baseline_artifact_id }}
          merge-multiple: true
          path: baseline

      - name: Checkout private source read-only
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          submodules: false

      - name: Initialize public Rust submodules
        run: >-
          node ci/private-step.mjs submodules source git
          -c submodule.aspeak.url=https://github.com/XUJiahua/aspeak.git
          -c submodule.srtparse.url=https://github.com/XUJiahua/srtparse.git
          submodule update --init aspeak srtparse

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: source/apps/reader/package.json

      - name: Install Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libfuse2 xvfb xauth openbox x11-utils iproute2

      - name: Install private application dependencies
        timeout-minutes: 10
        env:
          READER_INSTALL_NETWORK: direct
        run: node ci/private-step.mjs dependencies source/apps/reader bash --noprofile --norc scripts/install.sh --frozen-lockfile

      - name: Test desktop build contracts
        run: >-
          node ci/private-step.mjs contracts source/apps/reader node --test
          scripts/desktop-packaging.test.mjs scripts/desktop-artifacts.test.mjs
          scripts/desktop-source.test.mjs scripts/windows-native-signing.test.mjs
          scripts/desktop-source-maps.test.mjs
          scripts/desktop-installer-target.test.mjs
          scripts/desktop-upgrade-pair.test.mjs scripts/desktop-network-canary.test.mjs

      - name: Test desktop lifecycle and browser assets
        run: >-
          node ci/private-step.mjs host-contracts source/apps/reader pnpm exec vitest run
          scripts/reader-module-preloads.test.ts electron/main lib/desktop app/api/health/route.test.ts
          lib/transcribe/asr-readiness.test.ts lib/transcribe/availability.test.ts lib/transcribe/paths.test.ts
          lib/transcribe/sync.test.ts lib/transcribe/qwen3/manager.test.ts app/api/transcribe/route.test.ts
          app/api/transcribe/sync/route.test.ts app/api/transcribe/retry/route.test.ts app/api/narration/route.test.ts
          lib/config/store.test.ts lib/config/store-atomic.test.ts lib/config/store-read-errors.test.ts lib/config/store-corruption.test.ts lib/db/client-retry.test.ts
          lib/application/sync-push/review-local.real-db.test.ts lib/lang/current.test.ts lib/lang/context.test.ts
          components/add-content/AddContentDialog.test.tsx embed/app/routes/profile-route.test.tsx
          lib/articles/part-store-read-errors.test.ts lib/articles/part-store-corruption.test.ts lib/articles/part-store.test.ts lib/books/list.test.ts
          app/api/articles/[slug]/route.test.ts app/api/articles/[slug]/parts/[partId]/route.test.ts

      - name: Validate native NSIS user path handling
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: node ci/private-step.mjs nsis-path source/apps/reader node scripts/verify-nsis-user-path.mjs

      - name: Record native Windows storage token
        if: runner.os == 'Windows'
        shell: pwsh
        run: node ci/private-step.mjs storage-token source/apps/reader whoami /priv

      - name: Check native file read denial controls
        if: runner.os != 'Windows'
        shell: bash
        run: node ci/private-step.mjs read-controls source/apps/reader node scripts/verify-desktop-read-access.mjs

      - name: Check native file read denial controls on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          node ci/private-step.mjs read-controls source/apps/reader node scripts/verify-desktop-read-access.mjs

      - name: Validate native storage volume controls
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 3
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs storage-controls source/apps/reader node scripts/verify-desktop-storage-volume.mjs

      - name: Validate native storage volume controls on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: |
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          node ci/private-step.mjs storage-controls source/apps/reader node scripts/verify-desktop-storage-volume.mjs

      - name: Build unsigned candidates without publishing
        timeout-minutes: 40
        env:
          CI: true
          READER_BUILD_SHA: ${{ inputs.source_ref }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node ci/private-step.mjs build source/apps/reader pnpm dist --profile=core --unsigned --${{ matrix.arch }} --publish never

      - name: Audit packaged source maps
        run: node ci/private-step.mjs audit source node ../ci/audit-package.mjs apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.app }}

      - name: Validate isolated packaged service
        timeout-minutes: 5
        run: >-
          node ci/private-step.mjs service source/apps/reader node scripts/smoke-desktop-package.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.resources }}

      - name: Validate installed desktop window
        timeout-minutes: 5
        if: runner.os != 'Linux'
        run: >-
          node ci/private-step.mjs window source/apps/reader node scripts/smoke-desktop-window.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}

      - name: Validate Linux desktop window
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: >-
          node ci/private-step.mjs window source/apps/reader bash ../../../ci/run-xvfb.sh bash scripts/smoke-desktop-window-linux.sh
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}

      - name: Prepare checksums
        run: |
          node ci/private-step.mjs checksums source/apps/reader node scripts/desktop-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }} core
          node ci/private-step.mjs verify source/apps/reader node scripts/desktop-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }} core --verify

      - name: Validate actual installer lifecycle
        if: runner.os != 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs installer source/apps/reader node scripts/smoke-desktop-installers.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate actual Linux installer lifecycle
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs installer source/apps/reader bash ../../../ci/run-xvfb.sh node scripts/smoke-desktop-installers.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate Windows single-file runtime
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs portable source/apps/reader node scripts/smoke-desktop-portable.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate Linux single-file runtime
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs portable source/apps/reader bash ../../../ci/run-xvfb.sh node scripts/smoke-desktop-portable.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify actual installer version upgrade
        if: inputs.verify_upgrade && runner.os != 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs upgrade source/apps/reader node scripts/smoke-desktop-installers.mjs
          ../../../baseline release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify actual Linux installer version upgrade
        if: inputs.verify_upgrade && runner.os == 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs upgrade source/apps/reader bash ../../../ci/run-xvfb.sh node scripts/smoke-desktop-installers.mjs
          ../../../baseline release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate persisted speech preferences with missing engines
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs saved-speech source/apps/reader node scripts/smoke-desktop-saved-speech.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate permission denial and bounded-volume exhaustion
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs storage source/apps/reader node scripts/smoke-desktop-storage.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate permission denial and bounded-volume exhaustion on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: |
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          node ci/private-step.mjs storage source/apps/reader node scripts/smoke-desktop-storage.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate library volume exhaustion and same-process recovery
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs profile-storage source/apps/reader node scripts/smoke-desktop-profile-storage.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate library volume exhaustion and same-process recovery on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: |
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          node ci/private-step.mjs profile-storage source/apps/reader node scripts/smoke-desktop-profile-storage.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate denied reads and retained data recovery
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs read-access source/apps/reader node scripts/smoke-desktop-read-access.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate denied reads and retained data recovery on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: |
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          node ci/private-step.mjs read-access source/apps/reader node scripts/smoke-desktop-read-access.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate native text Markdown HTML and EPUB imports
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs formats source/apps/reader node scripts/smoke-desktop-formats.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate damaged JSON protection and restored files
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs corruption source/apps/reader node scripts/smoke-desktop-corruption.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate offline native reading and network restoration
        timeout-minutes: 12
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
          READER_TEST_NO_SANDBOX: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            node ci/private-step.mjs offline source/apps/reader bash ../../../ci/run-xvfb.sh node scripts/smoke-desktop-offline.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}
          else
            node ci/private-step.mjs offline source/apps/reader node scripts/smoke-desktop-offline.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}
          fi

      - name: Upload verified candidate artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.platform }}-${{ matrix.arch }}-candidate
          retention-days: 7
          if-no-files-found: error
          path: |
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.dmg
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.zip
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.exe
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.AppImage
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.deb
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.blockmap
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/desktop-*.yml
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/desktop-artifacts.json
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/SHA256SUMS

      - name: Encrypt private build logs
        if: always()
        run: node ci/seal-log.mjs

      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.platform }}-${{ matrix.arch }}-encrypted-log
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reader-private-build.log.enc.json

  historical-baseline:
    if: inputs.baseline_only && inputs.acceptance_json == '' && !inputs.internal
    needs: targets
    name: baseline-${{ matrix.id }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      READER_BUILD_SHA: ${{ inputs.source_ref }}
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require historical source identity
        run: node -e 'if(process.env.SOURCE_REF!=="4d4a44876e9833bae0c9d1120b588623f5a46ea8")process.exit(1)'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: source/apps/reader/package.json
      - name: Initialize native dependencies
        run: node ci/private-step.mjs submodules source git -c submodule.aspeak.url=https://github.com/XUJiahua/aspeak.git -c submodule.srtparse.url=https://github.com/XUJiahua/srtparse.git submodule update --init aspeak srtparse
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libfuse2 xvfb xauth
      - name: Install frozen historical dependencies
        env:
          READER_INSTALL_NETWORK: direct
        run: node ci/private-step.mjs dependencies source/apps/reader bash --noprofile --norc scripts/install.sh --frozen-lockfile
      - name: Build historical core without publishing
        env:
          CI: true
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node ci/private-step.mjs baseline source/apps/reader pnpm dist --profile=core --unsigned --${{ matrix.arch }} --publish never
      - name: Verify historical service
        run: node ci/private-step.mjs service source/apps/reader node scripts/smoke-desktop-package.mjs release/core/${{ matrix.id }}/${{ matrix.executable }} release/core/${{ matrix.id }}/${{ matrix.resources }}
      - name: Verify baseline identities
        run: |
          node ci/private-step.mjs index source/apps/reader node scripts/desktop-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }} core
          node ci/private-step.mjs checksums source/apps/reader node scripts/desktop-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }} core --verify
          node ci/record-historical-baseline.mjs source/apps/reader/release/core/${{ matrix.id }} source
      - name: Upload historical installers and provenance only
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.id }}-candidate
          retention-days: 7
          if-no-files-found: error
          path: |
            source/apps/reader/release/core/${{ matrix.id }}/*.dmg
            source/apps/reader/release/core/${{ matrix.id }}/*.zip
            source/apps/reader/release/core/${{ matrix.id }}/*.exe
            source/apps/reader/release/core/${{ matrix.id }}/*.AppImage
            source/apps/reader/release/core/${{ matrix.id }}/*.deb
            source/apps/reader/release/core/${{ matrix.id }}/*.blockmap
            source/apps/reader/release/core/${{ matrix.id }}/desktop-*.yml
            source/apps/reader/release/core/${{ matrix.id }}/desktop-artifacts.json
            source/apps/reader/release/core/${{ matrix.id }}/historical-baseline-provenance.json
            source/apps/reader/release/core/${{ matrix.id }}/SHA256SUMS
      - name: Encrypt private baseline logs
        if: always()
        run: node ci/seal-log.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-${{ matrix.id }}-baseline-encrypted-log
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reader-private-build.log.enc.json

  internal-upgrade:
    if: inputs.acceptance_json != ''
    needs: targets
    name: upgrade-${{ matrix.id }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ACCEPTANCE_JSON: ${{ inputs.acceptance_json }}
      SOURCE_REF: ${{ inputs.source_ref }}
      BUILD_TARGET: ${{ matrix.id }}
    steps:
      - name: Preserve native source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Verify immutable artifact provenance
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ci/internal-upgrade.mjs resolve
      - uses: actions/download-artifact@v4
        if: steps.resolve.outputs.baseline_run != ''
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.baseline_run }}
          name: reader-${{ matrix.id }}-candidate
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.candidate_run }}
          name: reader-internal-${{ matrix.id }}-candidate
          path: candidate
      - name: Checkout independent private validation tools
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ steps.resolve.outputs.tooling_sha }}
          path: source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          submodules: false
      - name: Materialize immutable published baseline
        if: steps.resolve.outputs.baseline_version != ''
        env:
          GH_TOKEN: ${{ secrets.INTERNAL_RELEASE_READ_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Configure a read-only token scoped to private release contents: INTERNAL_RELEASE_READ_TOKEN"
            exit 1
          fi
          node ci/private-step.mjs baseline source node scripts/release-materialize.mjs --catalog release/baselines/${{ steps.resolve.outputs.baseline_version }}.json --target desktop-${{ matrix.id }} --output ../baseline
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: source/apps/reader/package.json
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libfuse2 xvfb xauth openbox x11-utils iproute2
      - name: Install frozen validation dependencies
        env:
          READER_INSTALL_NETWORK: direct
        run: node ci/private-step.mjs dependencies source/apps/reader bash --noprofile --norc scripts/install.sh --frozen-lockfile
      - name: Restore omitted deterministic metadata and verify original digests
        run: node ci/internal-upgrade.mjs restore-blockmaps candidate source
      - name: Exercise actual installer upgrade
        if: runner.os != 'Linux'
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs upgrade source/apps/reader node scripts/smoke-desktop-installers.mjs
          ../../../baseline ../../../candidate ${{ steps.resolve.outputs.transition_flag }}
      - name: Exercise actual Linux installer upgrade
        if: runner.os == 'Linux'
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs upgrade source/apps/reader bash ../../../ci/run-xvfb.sh node scripts/smoke-desktop-installers.mjs
          ../../../baseline ../../../candidate ${{ steps.resolve.outputs.transition_flag }}
      - name: Bind upgrade result to source and artifact digests
        run: node ci/internal-upgrade.mjs record baseline candidate source internal-upgrade-provenance.json
      - name: Upload synthetic acceptance receipt
        uses: actions/upload-artifact@v4
        with:
          name: reader-internal-${{ matrix.id }}-upgrade
          retention-days: 7
          if-no-files-found: error
          path: internal-upgrade-provenance.json
      - name: Encrypt private acceptance logs
        if: always()
        run: node ci/seal-log.mjs
      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-internal-${{ matrix.id }}-upgrade-encrypted-log
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reader-private-build.log.enc.json

  internal-build:
    if: inputs.internal && inputs.acceptance_json == ''
    needs: targets
    name: internal-${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source line endings on native runners
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: '[[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public infrastructure
        run: node --test ci/*.test.mjs scripts/*.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: source/apps/reader/package.json
      - name: Initialize native sources
        run: >-
          node ci/private-step.mjs submodules source git
          -c submodule.aspeak.url=https://github.com/XUJiahua/aspeak.git
          -c submodule.srtparse.url=https://github.com/XUJiahua/srtparse.git
          submodule update --init --depth 1 aspeak srtparse third_party/llama.cpp-upstream
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libfuse2 xvfb xauth openbox x11-utils iproute2
      - name: Mac media dependencies
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install frozen application dependencies
        env:
          READER_INSTALL_NETWORK: direct
        run: node ci/private-step.mjs dependencies source/apps/reader bash --noprofile --norc scripts/install.sh --frozen-lockfile
      - name: Build engines and verify real models
        timeout-minutes: 70
        run: node ci/private-step.mjs speech source node scripts/prepare-internal-desktop.mjs
      - name: Build unsigned installers without publishing
        timeout-minutes: 45
        env:
          CI: true
          READER_BUILD_SHA: ${{ inputs.source_ref }}
        run: node ci/private-step.mjs build source/apps/reader pnpm dist --profile=bundled-speech --unsigned --${{ matrix.arch }} --publish never
      - name: Audit source maps
        run: node ci/private-step.mjs audit source node ../ci/audit-package.mjs apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.app }} --public-dependency-maps
      - name: Check actual packaged engines
        timeout-minutes: 20
        run: node ci/private-step.mjs speech-package source node scripts/check-internal-desktop.mjs apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.resources }}
      - name: Validate isolated packaged service
        timeout-minutes: 8
        run: >-
          node ci/private-step.mjs service source/apps/reader node scripts/smoke-desktop-package.mjs
          release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}
          release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.resources }}
      - name: Validate desktop window
        if: runner.os != 'Linux'
        timeout-minutes: 8
        run: node ci/private-step.mjs window source/apps/reader node scripts/smoke-desktop-window.mjs release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }} bundled-speech
      - name: Validate Linux window
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: node ci/private-step.mjs window source/apps/reader bash ../../../ci/run-xvfb.sh bash scripts/smoke-desktop-window-linux.sh release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }} bundled-speech
      - name: Verify artifact set
        run: node ci/private-step.mjs artifacts source/apps/reader node scripts/desktop-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }} bundled-speech
      - name: Validate actual installer lifecycle
        if: runner.os != 'Linux'
        timeout-minutes: 15
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs installers source/apps/reader node scripts/smoke-desktop-installers.mjs release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}
      - name: Validate Linux installer lifecycle
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs installers source/apps/reader bash ../../../ci/run-xvfb.sh node scripts/smoke-desktop-installers.mjs release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}
      - name: Validate actual Windows portable entry
        if: runner.os == 'Windows'
        timeout-minutes: 15
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs portable source/apps/reader node scripts/smoke-desktop-portable.mjs release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}
      - name: Validate actual Linux AppImage entry
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs portable source/apps/reader bash ../../../ci/run-xvfb.sh node scripts/smoke-desktop-portable.mjs release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}
      - name: Record immutable candidate provenance
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: node ci/record-internal-candidate.mjs source/apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }} source
      - name: Upload internal candidates only
        uses: actions/upload-artifact@v4
        with:
          name: reader-internal-${{ matrix.id }}-candidate
          retention-days: 7
          if-no-files-found: error
          path: |
            source/apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/*.dmg
            source/apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/*.zip
            source/apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/*.exe
            source/apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/*.AppImage
            source/apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/*.deb
            source/apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/*.blockmap
            source/apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/desktop-*.yml
            source/apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/desktop-artifacts.json
            source/apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/SHA256SUMS
            source/apps/reader/release/bundled-speech/${{ matrix.platform }}-${{ matrix.arch }}/internal-candidate-provenance.json
      - name: Encrypt private build logs
        if: always()
        run: node ci/seal-log.mjs
      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-internal-${{ matrix.id }}-encrypted-log
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reader-private-build.log.enc.json
