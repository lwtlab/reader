name: Desktop candidate packages
run-name: Desktop ${{ inputs.target || 'all' }} candidates

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full 40-character commit SHA in the private source repository
        required: true
        type: string

      target:
        description: Native build target
        required: true
        default: all
        type: choice
        options:
          - all
          - darwin-arm64
          - darwin-x64
          - win32-x64
          - linux-x64

      verify_upgrade:
        description: Require upgrade from the approved previous candidate (disable only when rebuilding a baseline; no upgrade acceptance)
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: node ci/select-targets.mjs
  build:
    needs: targets
    name: ${{ matrix.id }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate immutable source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'A full commit SHA is required.'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test public CI infrastructure
        run: node --test ci/log-crypto.test.mjs ci/private-step.test.mjs ci/verify-portable-baseline.test.mjs

      - name: Verify approved upgrade baseline
        if: inputs.verify_upgrade
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ matrix.id }}
        run: node ci/verify-upgrade-baseline.mjs

      - name: Download immutable previous candidate
        if: inputs.verify_upgrade
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.baseline_run_id }}
          artifact-ids: ${{ matrix.baseline_artifact_id }}
          merge-multiple: true
          path: baseline

      - name: Checkout private source read-only
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          submodules: false

      - name: Initialize public Rust submodules
        run: >-
          node ci/private-step.mjs submodules source git
          -c submodule.aspeak.url=https://github.com/XUJiahua/aspeak.git
          -c submodule.srtparse.url=https://github.com/XUJiahua/srtparse.git
          submodule update --init aspeak srtparse

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: source/apps/reader/package.json

      - name: Install Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libfuse2 xvfb xauth openbox x11-utils iproute2

      - name: Install private application dependencies
        timeout-minutes: 10
        env:
          READER_INSTALL_NETWORK: direct
        run: node ci/private-step.mjs dependencies source/apps/reader bash --noprofile --norc scripts/install.sh --frozen-lockfile

      - name: Test desktop build contracts
        run: >-
          node ci/private-step.mjs contracts source/apps/reader node --test
          scripts/desktop-packaging.test.mjs scripts/desktop-artifacts.test.mjs
          scripts/desktop-source.test.mjs scripts/windows-native-signing.test.mjs
          scripts/desktop-source-maps.test.mjs
          scripts/desktop-installer-target.test.mjs
          scripts/desktop-upgrade-pair.test.mjs scripts/desktop-network-canary.test.mjs

      - name: Test desktop lifecycle and browser assets
        run: >-
          node ci/private-step.mjs host-contracts source/apps/reader pnpm exec vitest run
          scripts/reader-module-preloads.test.ts electron/main lib/desktop app/api/health/route.test.ts
          lib/transcribe/asr-readiness.test.ts lib/transcribe/availability.test.ts lib/transcribe/paths.test.ts
          lib/transcribe/sync.test.ts lib/transcribe/qwen3/manager.test.ts app/api/transcribe/route.test.ts
          app/api/transcribe/sync/route.test.ts app/api/transcribe/retry/route.test.ts app/api/narration/route.test.ts
          lib/config/store.test.ts lib/config/store-atomic.test.ts

      - name: Validate native NSIS user path handling
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: node ci/private-step.mjs nsis-path source/apps/reader node scripts/verify-nsis-user-path.mjs

      - name: Validate native storage volume controls
        timeout-minutes: 3
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs storage-controls source/apps/reader node scripts/verify-desktop-storage-volume.mjs

      - name: Build unsigned candidates without publishing
        timeout-minutes: 40
        env:
          CI: true
          READER_BUILD_SHA: ${{ inputs.source_ref }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node ci/private-step.mjs build source/apps/reader pnpm dist --profile=core --unsigned --${{ matrix.arch }} --publish never

      - name: Audit packaged source maps
        run: node ci/private-step.mjs audit source node ../ci/audit-package.mjs apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.app }}

      - name: Validate isolated packaged service
        timeout-minutes: 5
        run: >-
          node ci/private-step.mjs service source/apps/reader node scripts/smoke-desktop-package.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.resources }}

      - name: Validate installed desktop window
        timeout-minutes: 5
        if: runner.os != 'Linux'
        run: >-
          node ci/private-step.mjs window source/apps/reader node scripts/smoke-desktop-window.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}

      - name: Validate Linux desktop window
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: >-
          node ci/private-step.mjs window source/apps/reader xvfb-run -a bash scripts/smoke-desktop-window-linux.sh
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}

      - name: Prepare checksums
        run: |
          node ci/private-step.mjs checksums source/apps/reader node scripts/desktop-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }} core
          node ci/private-step.mjs verify source/apps/reader node scripts/desktop-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }} core --verify

      - name: Validate actual installer lifecycle
        if: runner.os != 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs installer source/apps/reader node scripts/smoke-desktop-installers.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate actual Linux installer lifecycle
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs installer source/apps/reader xvfb-run -a node scripts/smoke-desktop-installers.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate Windows single-file runtime
        if: runner.os == 'Windows'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs portable source/apps/reader node scripts/smoke-desktop-portable.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate Linux single-file runtime
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs portable source/apps/reader xvfb-run -a node scripts/smoke-desktop-portable.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify actual installer version upgrade
        if: inputs.verify_upgrade && runner.os != 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs upgrade source/apps/reader node scripts/smoke-desktop-installers.mjs
          ../../../baseline release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify actual Linux installer version upgrade
        if: inputs.verify_upgrade && runner.os == 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs upgrade source/apps/reader xvfb-run -a node scripts/smoke-desktop-installers.mjs
          ../../../baseline release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate persisted speech preferences with missing engines
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs saved-speech source/apps/reader node scripts/smoke-desktop-saved-speech.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate permission denial and bounded-volume exhaustion
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs storage source/apps/reader node scripts/smoke-desktop-storage.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate offline native reading and network restoration
        timeout-minutes: 12
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
          READER_TEST_NO_SANDBOX: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            node ci/private-step.mjs offline source/apps/reader xvfb-run -a node scripts/smoke-desktop-offline.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}
          else
            node ci/private-step.mjs offline source/apps/reader node scripts/smoke-desktop-offline.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}
          fi

      - name: Upload verified candidate artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.platform }}-${{ matrix.arch }}-candidate
          retention-days: 7
          if-no-files-found: error
          path: |
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.dmg
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.zip
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.exe
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.AppImage
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.deb
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.blockmap
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/desktop-*.yml
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/desktop-artifacts.json
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/SHA256SUMS

      - name: Encrypt private build logs
        if: always()
        run: node ci/seal-log.mjs

      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.platform }}-${{ matrix.arch }}-encrypted-log
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reader-private-build.log.enc.json
