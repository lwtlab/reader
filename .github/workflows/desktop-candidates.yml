name: Desktop candidate packages
run-name: Desktop ${{ inputs.contracts_only && format('{0} contracts', inputs.target) || format('{0} candidates', inputs.target || 'all') }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full 40-character commit SHA in the private source repository
        required: true
        type: string

      qa_source_ref:
        description: Optional immutable QA correction SHA; only four fixed existing host-test, owned-volume and portable QA files may differ
        required: false
        default: ''
        type: string

      target:
        description: Native build target
        required: true
        default: all
        type: choice
        options:
          - all
          - darwin-arm64
          - darwin-x64
          - win32-x64
          - linux-x64

      verify_upgrade:
        description: Require upgrade from the approved previous candidate (disable only when rebuilding a baseline; no upgrade acceptance)
        required: true
        default: true
        type: boolean

      enable_updates:
        description: Bake authenticated update policy into the new candidate; final macOS signing and update authentication run separately
        required: true
        default: false
        type: boolean

      contracts_only:
        description: Run targeted Windows or Intel Mac contracts only (no candidates or release acceptance)
        required: true
        default: false
        type: boolean

      native_rust:
        description: Also compile and inspect Windows Rust inputs in contracts-only diagnostics (no candidates)
        required: true
        default: false
        type: boolean

      browser_assets:
        description: Rebuild and inspect the fixed Windows browser module in contracts-only diagnostics (no candidates)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  targets:
    if: ${{ !inputs.contracts_only }}
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: node ci/select-targets.mjs
  build:
    if: ${{ !inputs.contracts_only }}
    needs: targets
    name: ${{ matrix.id }}
    # Cold Intel tool install/build plus the complete recovery/offline/privacy tail
    # exceeded 75 minutes in 45777132115. Per-step limits stay unchanged.
    timeout-minutes: ${{ matrix.id == 'darwin-x64' && 105 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate immutable source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'A full lowercase 40-character commit SHA is required.'
            exit 1
          fi
          if [[ -n "$QA_SOURCE_REF" && ! "$QA_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'An independent QA revision must be a full lowercase 40-character commit SHA.'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0

      - name: Test public CI infrastructure
        run: node --test ci/log-crypto.test.mjs ci/private-step.test.mjs ci/verify-portable-baseline.test.mjs ci/run-xvfb.test.mjs ci/audit-package.test.mjs ci/verify-qa-source.test.mjs

      - uses: ./.github/actions/privacy-tools

      - name: Test release privacy guard
        run: node --test scripts/privacy-publication.test.mjs

      - name: Verify approved upgrade baseline
        if: inputs.verify_upgrade
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ matrix.id }}
        run: node ci/verify-upgrade-baseline.mjs

      - name: Download immutable previous candidate
        if: inputs.verify_upgrade
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.baseline_run_id }}
          artifact-ids: ${{ matrix.baseline_artifact_id }}
          merge-multiple: true
          path: baseline

      - name: Checkout private source read-only
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          submodules: false

      - name: Initialize public Rust submodules
        run: >-
          node ci/private-step.mjs submodules source git
          -c submodule.aspeak.url=https://github.com/XUJiahua/aspeak.git
          -c submodule.srtparse.url=https://github.com/XUJiahua/srtparse.git
          submodule update --init aspeak srtparse

      - name: Checkout optional immutable host-test source read-only
        if: inputs.qa_source_ref != ''
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ inputs.qa_source_ref }}
          path: qa-source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
          submodules: false

      - name: Verify identical compiled inputs and the fixed reviewed QA allowance
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: |
          qa_args=()
          if [[ -n "$QA_SOURCE_REF" ]]; then qa_args+=(--qa-source "$GITHUB_WORKSPACE/qa-source" --qa-ref "$QA_SOURCE_REF"); fi
          node ci/private-step.mjs qa-inputs source node ../ci/verify-qa-source.mjs verify --source "$GITHUB_WORKSPACE/source" --source-ref "$SOURCE_REF" "${qa_args[@]}"

      - name: Initialize the same public Rust inputs for independent host tests
        if: inputs.qa_source_ref != ''
        run: >-
          node ci/private-step.mjs qa-submodules source git -C ../qa-source
          -c submodule.aspeak.url=https://github.com/XUJiahua/aspeak.git
          -c submodule.srtparse.url=https://github.com/XUJiahua/srtparse.git
          submodule update --init aspeak srtparse

      - name: Verify frozen source inputs and original notice bytes before native tools
        run: node ci/private-step.mjs frozen-inputs source node ../ci/verify-release-inputs.mjs .

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: source/apps/reader/package.json

      - name: Install Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libfuse2 xvfb xauth openbox x11-utils iproute2

      - name: Install private application dependencies
        timeout-minutes: 10
        env:
          READER_INSTALL_NETWORK: direct
        run: node ci/private-step.mjs dependencies source/apps/reader bash --noprofile --norc scripts/install.sh --frozen-lockfile

      - name: Link reviewed host tests to the application dependencies without reinstalling
        if: inputs.qa_source_ref != ''
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: >-
          node ci/private-step.mjs qa-dependencies source node ../ci/verify-qa-source.mjs link
          --source "$GITHUB_WORKSPACE/source" --source-ref "$SOURCE_REF"
          --qa-source "$GITHUB_WORKSPACE/qa-source" --qa-ref "$QA_SOURCE_REF"

      - name: Test desktop build contracts
        run: >-
          node ci/private-step.mjs contracts source/apps/reader node --test
          scripts/desktop-packaging.test.mjs scripts/native-build-privacy.test.mjs scripts/windows-native-paths.test.mjs scripts/windows-rust-privacy.test.mjs scripts/pdfium-build.test.mjs scripts/appimage-runtime.test.mjs scripts/desktop-artifacts.test.mjs
          scripts/desktop-source.test.mjs scripts/windows-native-signing.test.mjs
          scripts/desktop-source-maps.test.mjs
          scripts/onnx-runtime-distribution.test.mjs scripts/dependency-notices.test.mjs
          scripts/collect-local-cargo-notices.test.mjs scripts/unoptimized-image-packaging.test.mjs
          scripts/desktop-installer-target.test.mjs scripts/desktop-profile-storage-probe.test.mjs
          scripts/desktop-upgrade-pair.test.mjs scripts/desktop-network-canary.test.mjs

      - name: Test reviewed owned-volume cleanup contracts
        if: inputs.qa_source_ref != ''
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: >-
          node ci/private-step.mjs volume-contracts source/apps/reader node ../../../ci/verify-qa-source.mjs run-volume-contracts
          --source "$GITHUB_WORKSPACE/source" --source-ref "$SOURCE_REF"
          --qa-source "$GITHUB_WORKSPACE/qa-source" --qa-ref "$QA_SOURCE_REF"

      - name: Test desktop lifecycle and browser assets
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: |
          qa_args=()
          if [[ -n "$QA_SOURCE_REF" ]]; then qa_args+=(--qa-source "$GITHUB_WORKSPACE/qa-source" --qa-ref "$QA_SOURCE_REF"); fi
          node ci/private-step.mjs host-contracts source/apps/reader node ../../../ci/verify-qa-source.mjs run-host-contracts \
            --source "$GITHUB_WORKSPACE/source" --source-ref "$SOURCE_REF" \
            --vitest "$GITHUB_WORKSPACE/source/apps/reader/node_modules/vitest/vitest.mjs" "${qa_args[@]}" -- \
            --maxWorkers=${{ matrix.id == 'darwin-x64' && 1 || 2 }} \
            scripts/reader-module-preloads.test.ts scripts/electron-sqlite.test.ts electron/main lib/desktop app/api/health/route.test.ts \
            lib/transcribe/asr-readiness.test.ts lib/transcribe/availability.test.ts lib/transcribe/paths.test.ts \
            lib/transcribe/sync.test.ts lib/transcribe/qwen3/manager.test.ts app/api/transcribe/route.test.ts \
            app/api/transcribe/sync/route.test.ts app/api/transcribe/retry/route.test.ts app/api/narration/route.test.ts \
            lib/config/store.test.ts lib/config/store-atomic.test.ts lib/config/store-read-errors.test.ts lib/config/store-corruption.test.ts lib/db/client-retry.test.ts \
            lib/application/sync-push/review-local.real-db.test.ts lib/lang/current.test.ts lib/lang/context.test.ts \
            components/add-content/AddContentDialog.test.tsx embed/app/routes/profile-route.test.tsx \
            lib/articles/part-store-read-errors.test.ts lib/articles/part-store-corruption.test.ts lib/articles/part-store-durable.test.ts scripts/desktop-storage-probe.test.ts lib/articles/part-store.test.ts lib/books/list.test.ts \
            app/api/articles/[slug]/route.test.ts app/api/articles/[slug]/parts/[partId]/route.test.ts

      - name: Confirm host tests left both tracked source trees unchanged
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: |
          qa_args=()
          if [[ -n "$QA_SOURCE_REF" ]]; then qa_args+=(--qa-source "$GITHUB_WORKSPACE/qa-source" --qa-ref "$QA_SOURCE_REF"); fi
          node ci/private-step.mjs qa-clean source node ../ci/verify-qa-source.mjs check-clean --source "$GITHUB_WORKSPACE/source" --source-ref "$SOURCE_REF" "${qa_args[@]}"

      - name: Validate native NSIS user path handling
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: node ci/private-step.mjs nsis-path source/apps/reader node scripts/verify-nsis-user-path.mjs

      - name: Record native Windows storage token
        if: runner.os == 'Windows'
        shell: pwsh
        run: node ci/private-step.mjs storage-token source/apps/reader whoami /priv

      - name: Check native file read denial controls
        if: runner.os != 'Windows'
        shell: bash
        run: node ci/private-step.mjs read-controls source/apps/reader node scripts/verify-desktop-read-access.mjs

      - name: Check native file read denial controls on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          node ci/private-step.mjs read-controls source/apps/reader node scripts/verify-desktop-read-access.mjs

      - name: Validate native storage volume controls
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 3
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs storage-controls source/apps/reader node scripts/verify-desktop-storage-volume.mjs

      - name: Validate native storage volume controls on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: |
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          node ci/private-step.mjs storage-controls source/apps/reader node scripts/verify-desktop-storage-volume.mjs

      - name: Test native Windows installer archive privacy
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: node ci/private-step.mjs installer-privacy source/apps/reader node scripts/windows-installer-privacy.mjs ../../../ci/privacy-candidates.mjs

      - name: Install fixed Rust dependency scanner
        timeout-minutes: 20
        run: node ci/private-step.mjs rust-audit-tools source cargo install cargo-audit --version 0.23.0 --locked

      - name: Build unsigned candidates without publishing
        timeout-minutes: 40
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
          READER_BUILD_SHA: ${{ inputs.source_ref }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          READER_ENABLE_UPDATES: ${{ inputs.enable_updates }}
        run: |
          update_args=()
          if [[ "$READER_ENABLE_UPDATES" == "true" ]]; then update_args+=(--auto-update); fi
          node ci/private-step.mjs build source/apps/reader pnpm dist --profile=core --unsigned --${{ matrix.arch }} --publish never "${update_args[@]}"

      - name: Audit packaged source maps
        run: node ci/private-step.mjs audit source node ../ci/audit-package.mjs apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.app }}

      - name: Validate isolated packaged service
        timeout-minutes: 5
        run: >-
          node ci/private-step.mjs service source/apps/reader node scripts/smoke-desktop-package.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.resources }}

      - name: Validate installed desktop window
        timeout-minutes: 5
        if: runner.os != 'Linux'
        run: >-
          node ci/private-step.mjs window source/apps/reader node scripts/smoke-desktop-window.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}

      - name: Validate Linux desktop window
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: >-
          node ci/private-step.mjs window source/apps/reader bash ../../../ci/run-xvfb.sh bash scripts/smoke-desktop-window-linux.sh
          release/core/${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}

      - name: Prepare checksums
        run: |
          node ci/private-step.mjs checksums source/apps/reader node scripts/desktop-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }} core
          node ci/private-step.mjs verify source/apps/reader node scripts/desktop-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }} core --verify

      - name: Validate actual installer lifecycle
        if: runner.os != 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs installer source/apps/reader node scripts/smoke-desktop-installers.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate actual Linux installer lifecycle
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs installer source/apps/reader bash ../../../ci/run-xvfb.sh node scripts/smoke-desktop-installers.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate Windows single-file runtime
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: |
          $qaArgs = @()
          if ($env:QA_SOURCE_REF) { $qaArgs = @('--qa-source', (Join-Path $env:GITHUB_WORKSPACE 'qa-source'), '--qa-ref', $env:QA_SOURCE_REF) }
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'source'
          $candidate = Join-Path $sourceRoot 'apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}'
          node ci/private-step.mjs portable source/apps/reader node ../../../ci/verify-qa-source.mjs run-portable-qa --source $sourceRoot --source-ref $env:SOURCE_REF @qaArgs --candidate $candidate

      - name: Validate Linux single-file runtime
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs portable source/apps/reader bash ../../../ci/run-xvfb.sh node scripts/smoke-desktop-portable.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify actual installer version upgrade
        if: inputs.verify_upgrade && runner.os != 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs upgrade source/apps/reader node scripts/smoke-desktop-installers.mjs
          ../../../baseline release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify actual Linux installer version upgrade
        if: inputs.verify_upgrade && runner.os == 'Linux'
        timeout-minutes: 10
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs upgrade source/apps/reader bash ../../../ci/run-xvfb.sh node scripts/smoke-desktop-installers.mjs
          ../../../baseline release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate persisted speech preferences with missing engines
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: >-
          node ci/private-step.mjs saved-speech source/apps/reader node scripts/smoke-desktop-saved-speech.mjs
          release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate permission denial and bounded-volume exhaustion
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: |
          qa_args=()
          if [[ -n "$QA_SOURCE_REF" ]]; then qa_args+=(--qa-source "$GITHUB_WORKSPACE/qa-source" --qa-ref "$QA_SOURCE_REF"); fi
          node ci/private-step.mjs storage source/apps/reader node ../../../ci/verify-qa-source.mjs run-volume-qa \
            --source "$GITHUB_WORKSPACE/source" --source-ref "$SOURCE_REF" "${qa_args[@]}" \
            --entry smoke-desktop-storage.mjs --candidate "$GITHUB_WORKSPACE/source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}"
      - name: Validate permission denial and bounded-volume exhaustion on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: |
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          $qaArgs = @()
          if ($env:QA_SOURCE_REF) { $qaArgs = @('--qa-source', (Join-Path $env:GITHUB_WORKSPACE 'qa-source'), '--qa-ref', $env:QA_SOURCE_REF) }
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'source'
          $candidate = Join-Path $sourceRoot 'apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}'
          node ci/private-step.mjs storage source/apps/reader node ../../../ci/verify-qa-source.mjs run-volume-qa --source $sourceRoot --source-ref $env:SOURCE_REF @qaArgs --entry smoke-desktop-storage.mjs --candidate $candidate
      - name: Validate library volume exhaustion and same-process recovery
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: |
          qa_args=()
          if [[ -n "$QA_SOURCE_REF" ]]; then qa_args+=(--qa-source "$GITHUB_WORKSPACE/qa-source" --qa-ref "$QA_SOURCE_REF"); fi
          node ci/private-step.mjs profile-storage source/apps/reader node ../../../ci/verify-qa-source.mjs run-volume-qa \
            --source "$GITHUB_WORKSPACE/source" --source-ref "$SOURCE_REF" "${qa_args[@]}" \
            --entry smoke-desktop-profile-storage.mjs --candidate "$GITHUB_WORKSPACE/source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}"
      - name: Validate library volume exhaustion and same-process recovery on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: |
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          $qaArgs = @()
          if ($env:QA_SOURCE_REF) { $qaArgs = @('--qa-source', (Join-Path $env:GITHUB_WORKSPACE 'qa-source'), '--qa-ref', $env:QA_SOURCE_REF) }
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'source'
          $candidate = Join-Path $sourceRoot 'apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}'
          node ci/private-step.mjs profile-storage source/apps/reader node ../../../ci/verify-qa-source.mjs run-volume-qa --source $sourceRoot --source-ref $env:SOURCE_REF @qaArgs --entry smoke-desktop-profile-storage.mjs --candidate $candidate
      - name: Validate denied reads and retained data recovery
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs read-access source/apps/reader node scripts/smoke-desktop-read-access.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate denied reads and retained data recovery on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: |
          $env:PSModulePath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"
          node ci/private-step.mjs read-access source/apps/reader node scripts/smoke-desktop-read-access.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate native text Markdown HTML and EPUB imports
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs formats source/apps/reader node scripts/smoke-desktop-formats.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate damaged JSON protection and restored files
        timeout-minutes: 5
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
        run: node ci/private-step.mjs corruption source/apps/reader node scripts/smoke-desktop-corruption.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Validate offline native reading and network restoration
        timeout-minutes: 12
        env:
          READER_INSTALLER_TEST_DISPOSABLE: '1'
          READER_TEST_NO_SANDBOX: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            node ci/private-step.mjs offline source/apps/reader bash ../../../ci/run-xvfb.sh node scripts/smoke-desktop-offline.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}
          else
            node ci/private-step.mjs offline source/apps/reader node scripts/smoke-desktop-offline.mjs release/core/${{ matrix.platform }}-${{ matrix.arch }}
          fi

      - name: Record immutable application and independent host-test provenance
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          QA_SOURCE_REF: ${{ inputs.qa_source_ref }}
        run: |
          qa_args=()
          if [[ -n "$QA_SOURCE_REF" ]]; then qa_args+=(--qa-source "$GITHUB_WORKSPACE/qa-source" --qa-ref "$QA_SOURCE_REF"); fi
          node ci/private-step.mjs qa-provenance source node ../ci/verify-qa-source.mjs record \
            --source "$GITHUB_WORKSPACE/source" --source-ref "$SOURCE_REF" "${qa_args[@]}" \
            --output "$GITHUB_WORKSPACE/source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/desktop-qa-source.json"

      - name: Audit final candidate files before upload
        run: node ci/private-step.mjs privacy source node ../ci/privacy-candidates.mjs apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Upload privacy-checked candidate artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.platform }}-${{ matrix.arch }}-candidate
          retention-days: 7
          if-no-files-found: error
          path: |
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.dmg
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.zip
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.exe
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.AppImage
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.deb
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/*.blockmap
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/desktop-*.yml
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/desktop-*.json
            source/apps/reader/release/core/${{ matrix.platform }}-${{ matrix.arch }}/SHA256SUMS

      - name: Encrypt private build logs
        if: always()
        run: node ci/seal-log.mjs

      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-${{ matrix.platform }}-${{ matrix.arch }}-encrypted-log
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reader-private-build.log.enc.json

  windows-storage:
    if: ${{ inputs.contracts_only && inputs.target != 'darwin-x64' }}
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.native_rust && 30 || 15 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'A full commit SHA is required.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: ./.github/actions/privacy-tools
      - name: Test public privacy guard
        run: node --test scripts/privacy-publication.test.mjs
      - name: Checkout private source read-only
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: source/apps/reader/package.json
      - name: Initialize native Rust input submodules
        if: inputs.native_rust
        run: >-
          node ci/private-step.mjs native-submodules source git
          -c submodule.aspeak.url=https://github.com/XUJiahua/aspeak.git
          -c submodule.srtparse.url=https://github.com/XUJiahua/srtparse.git
          submodule update --init aspeak srtparse
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Check native path alias transport before dependency installation
        run: >-
          node ci/private-step.mjs path-aliases source/apps/reader node --input-type=module
          -e "const {nativeBuildEnvironment}=await import('./scripts/native-build-privacy.mjs'); nativeBuildEnvironment(process.cwd()); console.log('PASS native path alias transport')"
      - name: Install private application dependencies
        env:
          READER_INSTALL_NETWORK: direct
        run: node ci/private-step.mjs dependencies source/apps/reader bash --noprofile --norc scripts/install.sh --frozen-lockfile
      - name: Check native ESM import
        run: >-
          node ci/private-step.mjs native-import source/apps/reader node --input-type=module
          -e "await import('./scripts/desktop-storage-probe.mjs'); console.log('PASS native ESM storage probe import')"
      - name: Inspect fixed Windows browser assignment
        if: inputs.browser_assets
        timeout-minutes: 5
        run: node ci/private-step.mjs browser-proof source/apps/reader node scripts/windows-browser-privacy.mjs
      - name: Check pinned Windows PDFium input
        run: >-
          node ci/private-step.mjs pdfium-input source/apps/reader node --input-type=module
          -e "const {preparePdfiumBuild}=await import('./scripts/pdfium-build.mjs'); const {resolve}=await import('node:path'); await preparePdfiumBuild(resolve('../..')); console.log('PASS pinned Windows PDFium library and notices')"
      - name: Test native installer archive privacy
        run: node ci/private-step.mjs installer-privacy source/apps/reader node scripts/windows-installer-privacy.mjs ../../../ci/privacy-candidates.mjs
      - name: Test native compiler privacy
        run: >-
          node ci/private-step.mjs compiler-privacy source/apps/reader node --test
          scripts/native-build-privacy.test.mjs scripts/windows-native-paths.test.mjs scripts/windows-rust-privacy.test.mjs
      - name: Run storage contracts
        run: >-
          node ci/private-step.mjs storage-contracts source/apps/reader pnpm exec vitest run --maxWorkers=1 --reporter=json
          scripts/desktop-storage-probe.test.ts lib/articles/part-store-durable.test.ts scripts/electron-sqlite.test.ts
      - name: Build and inspect actual Rust native inputs
        if: inputs.native_rust
        run: node ci/private-step.mjs native-rust source/apps/reader node scripts/windows-rust-privacy.mjs
      - name: Encrypt private logs
        if: always()
        run: node ci/seal-log.mjs
      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-windows-storage-encrypted-log
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reader-private-build.log.enc.json

  darwin-x64-host:
    if: ${{ inputs.contracts_only && inputs.target == 'darwin-x64' }}
    name: darwin-x64 focused host contracts
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'A full commit SHA is required.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Test encrypted diagnostic transport
        run: node --test ci/log-crypto.test.mjs ci/private-step.test.mjs
      - name: Checkout private source read-only
        uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.PRIVATE_SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          package_json_file: source/apps/reader/package.json
      - name: Install private application dependencies
        env:
          READER_INSTALL_NETWORK: direct
        run: node ci/private-step.mjs dependencies source/apps/reader bash --noprofile --norc scripts/install.sh --frozen-lockfile
      - name: Check Intel cold database and lazy import contracts serially
        run: >-
          node ci/private-step.mjs focused-host source/apps/reader pnpm exec vitest run --maxWorkers=1
          lib/articles/part-store.test.ts components/add-content/AddContentDialog.test.tsx
      - name: Encrypt private logs
        if: always()
        run: node ci/seal-log.mjs
      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-darwin-x64-host-encrypted-log
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reader-private-build.log.enc.json
