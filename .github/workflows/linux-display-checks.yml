name: Linux virtual display diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [default, noreset]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install virtual display tools
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth openbox x11-utils
      - name: Exercise repeated display and window manager startup
        run: node ci/linux-display-probe.mjs ${{ matrix.mode }}
